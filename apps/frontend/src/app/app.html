<header class="vl-header">
  <h1>Volle Lotte</h1>
  <p-selectbutton
    [options]="modes"
    [ngModel]="theme.mode()"
    (ngModelChange)="theme.set($event)"
    optionLabel="label"
    optionValue="value"
    [allowEmpty]="false"
    ariaLabel="Colour theme"
  />
</header>
@if (socket.connection() !== 'connected') {
<p-message severity="warn" role="status">
  Connection: {{ socket.connection() }}. Trying to reconnect.
</p-message>
}
<p-toast position="top-center" />
<main class="vl-main"><router-outlet /></main>

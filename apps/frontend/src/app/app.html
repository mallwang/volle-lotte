<header class="vl-header">
  <h1 class="vl-brand">
    <img src="/volle-lotte.png" alt="" class="vl-logo" /><span
      >Volle Lotte <small class="vl-version">v{{ version }}</small></span
    >
  </h1>
  @if (socket.session() && !socket.game()) {
  <nav class="vl-nav" [attr.aria-label]="'nav.main' | t">
    <a routerLink="/lobby" routerLinkActive="active">{{ 'nav.games' | t }}</a>
    <a routerLink="/create-game" routerLinkActive="active">{{ 'nav.create' | t }}</a>
  </nav>
  }
  <p-select
    class="vl-lang"
    size="small"
    [options]="i18n.languages"
    [ngModel]="i18n.lang()"
    (ngModelChange)="i18n.set($event)"
    optionLabel="name"
    optionValue="code"
    [ariaLabel]="'language.label' | t"
  >
    <ng-template #selectedItem let-o>
      <img [src]="o.flag" alt="" class="vl-flag" />
    </ng-template>
    <ng-template #item let-o>
      <span class="vl-lang-item"><img [src]="o.flag" alt="" class="vl-flag" />{{ o.name }}</span>
    </ng-template>
  </p-select>
  <p-button
    [rounded]="true"
    [text]="true"
    severity="secondary"
    (onClick)="theme.next()"
    [ariaLabel]="('theme.label' | t) + ': ' + ('theme.' + theme.mode() | t)"
    [pTooltip]="'theme.' + theme.mode() | t"
  >
    <svg
      class="vl-theme-icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      @switch (theme.mode()) { @case ('light') {
      <circle cx="12" cy="12" r="4" />
      <path
        d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
      />
      } @case ('dark') {
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
      } @default {
      <rect x="3" y="4" width="18" height="12" rx="2" />
      <path d="M8 20h8M12 16v4" />
      } }
    </svg>
  </p-button>
</header>
@if (socket.connection() !== 'connected') {
<p-message severity="warn" role="status">
  {{ 'connection.status' | t: { state: ('connection.' + socket.connection()) | t } }}
</p-message>
}
<p-toast position="top-center" />
<main class="vl-main"><router-outlet /></main>

<header>
  <h1>Volle Lotte</h1>
  @if (socket.connection() !== 'connected') {
  <p role="status">Connection: {{ socket.connection() }}. Trying to reconnect.</p>
  } @if (socket.notice(); as notice) {
  <p role="alert">
    {{ notice }}
    <button type="button" (click)="socket.notice.set(null)">Dismiss</button>
  </p>
  }
</header>
<main><router-outlet /></main>

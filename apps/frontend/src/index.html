<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Volle Lotte</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Set the dark class before first paint (same logic as ThemeService).
      (function () {
        var m;
        try {
          m = localStorage.getItem('vl-theme');
        } catch (e) {}
        var dark =
          m === 'dark' ||
          (m !== 'light' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('app-dark');
      })();
    </script>
    <link rel="icon" type="image/png" href="volle-lotte.png" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
